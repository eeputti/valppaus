<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lisää asiakas listalle – Valppaus</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="./styles.css?v=20251217" />
  <style id="critical">
:root{
  --bg:#ffffff;
  --ink:#0F172A;
  --muted:#475569;
  --line:#e5e7eb;
  --primary:#5AA0FF;
  --primary-ink:#ffffff;
  --shadow:0 12px 30px rgba(15,23,42,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif}
.container{max-width:1100px;margin:0 auto;padding:0 20px}

.topbar{background:var(--primary);color:#fff}
.topbar-inner{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;font-size:14px}
.topbar a{color:#fff;text-decoration:none;font-weight:900;border:2px solid #fff;border-radius:999px;padding:6px 10px}
.topbar a:hover{background:#ffffff22}

.header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:50}
.header-inner{display:flex;justify-content:space-between;align-items:center;padding:14px 0}
.logo img{height:36px;width:auto;display:block}
.nav{display:flex;gap:10px;align-items:center}
.btn, .cta{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:10px 16px;font-weight:900;text-decoration:none}
.cta{background:var(--primary);color:var(--primary-ink);box-shadow:var(--shadow);border:0}
.cta:hover{filter:brightness(.95)}
.btn{border:1.5px solid var(--ink);color:var(--ink)}
.btn:hover{background:var(--ink);color:#fff}

.cta-float{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:60;display:none}
.cta-float a{display:inline-flex;align-items:center;gap:8px;background:var(--primary);color:#fff;border-radius:999px;padding:12px 18px;font-weight:900;text-decoration:none;box-shadow:var(--shadow)}
@media (max-width:860px){ .cta-float{display:block} .nav .cta.primary{display:none} }

/* Hero */
.hero{padding:64px 0 28px;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-120px;top:-120px;width:360px;height:360px;background:radial-gradient(closest-side, #EEF5FF, rgba(0,0,0,0));border-radius:50%}
.badge{display:inline-block;background:#EEF5FF;color:var(--primary);font-weight:900;font-size:12px;padding:6px 10px;border-radius:999px;margin:0 0 14px}
.h1{font-size:44px;line-height:1.04;letter-spacing:-.02em;margin:0 0 12px;font-weight:1000;max-width:900px}
.sub{font-size:18px;color:var(--muted);max-width:820px;margin:0 0 18px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}

/* Sections */
.section{padding:32px 0;border-bottom:1px solid var(--line)}
.h2{font-size:24px;margin:0 0 12px;font-weight:1000}
.card{border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.mini{font-size:14px;color:var(--muted)}

/* Why tiles (no CTAs inside) */
.tiles4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:12px}
.tile{border:2px solid var(--ink);border-radius:0;padding:16px;display:flex;flex-direction:column;gap:6px;min-height:140px;box-shadow:none}
.tile b{font-size:16px}
.tile p{margin:0;font-size:14px;color:var(--muted)}

/* Pricing */
.pricing{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.plan{border:2px solid var(--line);border-radius:18px;background:#fff;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);aspect-ratio:1/1;justify-content:space-between}
.plan.highlight{border-color:var(--primary)}
.plan .plan-top{display:flex;justify-content:space-between;align-items:center}
.plan .tag{background:#EEF5FF;color:var(--primary);font-weight:900;font-size:12px;padding:6px 10px;border-radius:999px}
.price{display:flex;align-items:baseline;gap:8px;margin:6px 0}
.price .num{font-size:30px;font-weight:1000}
.price .sub{font-size:12px;color:var(--muted)}
.ul{margin:0 0 0 18px;padding:0;display:flex;flex-direction:column;gap:8px}
.plan .cta-plan{margin-top:10px;display:inline-flex;align-items:center;gap:8px;background:var(--primary);color:#fff;border:none;border-radius:12px;padding:10px 14px;font-weight:900;text-decoration:none;justify-content:center}
.plan .cta-plan:hover{filter:brightness(.95)}

/* FAQ */
.faq{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.qa{border:1px solid var(--line);border-radius:14px;padding:14px}
.qa b{display:block;margin-bottom:6px}

/* Forms pages */
.form{max-width:560px;margin:0 auto}
label{font-weight:900;font-size:14px;display:block;margin-top:6px}
input,select,button,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px;margin:6px 0 12px}
button.primary{background:var(--primary);color:#fff;border:none;font-weight:900;cursor:pointer}
button.primary:hover{filter:brightness(.95)}
.ok{color:#16a34a;font-weight:900}
/* Consent emphasis */
.consent-label{display:flex;align-items:flex-start;gap:8px;background:#F6F9FF;border:1px solid #dbeafe;border-radius:12px;padding:12px;margin:6px 0 12px;font-weight:900}
.consent-label input{margin-top:2px}

/* Footer */
.footer{padding:18px 0;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
a.link{color:var(--ink);font-weight:900;text-decoration:underline}

/* Responsive */
@media (max-width:1100px){ .tiles4{grid-template-columns:1fr 1fr} }
@media (max-width:720px){ .tiles4{grid-template-columns:1fr} }
@media (max-width:980px){ .pricing,.faq{grid-template-columns:1fr} .plan{aspect-ratio:auto;min-height:420px} .h1{font-size:36px} }
</style>
</head>
<body>

  <div class="header">
    <div class="container header-inner">
      <a href="./index.html" class="logo" aria-label="Valppaus"><img src="./logo.svg" alt="Valppaus" /></a>
      <nav class="nav"><a class="btn" href="./index.html">Etusivu</a></nav>
    </div>
  </div>

  <main class="container section">
    <div class="form card">
      <div class="badge">Asiakaspalvelulle</div>
      <h1 class="h2">Lisää asiakas peruutuslistalle</h1>
      <p class="mini">Täytä tiedot. Lähetys avaa sähköpostin osoitteeseen <b>join@valppaus.fi</b>. Älä kirjaa diagnooseja.</p>

      <label>Toimipistekoodi (vapaa teksti)</label>
      <input id="src" placeholder="esim. lahti-aurinkorinne" />

      <label>Palvelu (vapaa teksti)</label>
      <input id="service" placeholder="esim. psykoterapia" />

      <label>Asiakkaan nimi (etunimi)</label>
      <input id="first_name" placeholder="Etunimi" />

      <label>Puhelinnumero</label>
      <input id="phone" placeholder="+358…" />

      <label class="consent-label">
        <input type="checkbox" id="consent" />
        <span>Suostumus: asiakas antoi luvan vastaanottaa peruutusaikoihin liittyviä tekstiviestejä Valppaukselta.</span>
      </label>

      <label>Lisätietoja (valinnainen, vapaa teksti)</label>
      <textarea id="note" rows="3" placeholder="Esim. toivoo ilta-aikoja."></textarea>

      <button class="primary" id="send">Lähetä liittyminen</button>
      <p id="ok" class="ok" style="display:none">Luotu viesti — tarkista ja lähetä sähköpostista.</p>
    </div>
  </main>

  <footer class="footer container">
    <div>© Valppaus • <a class="link" href="./privacy.html">GDPR</a></div>
  </footer>

<script src="./main.js?v=20251217"></script>
</body>
</html>
